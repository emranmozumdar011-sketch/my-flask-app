<input id="linkInput" class="paste-input-box" type="url" placeholder="Paste Link Here" aria-label="Paste video link">
<div id="errorNotice" class="error-notice" role="status" aria-live="polite"></div>
<button id="downloadBtn" class="download-action-btn" type="button">DOWNLOAD</button>
<div class="progress-section"><div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div><div id="percentageText" class="percentage">0%</div></div>
<div id="videosWrapper" class="videos-circle-wrapper" role="button" tabindex="0" aria-label="Download history"><div class="led-ring" aria-hidden="true"><i class="led-dot" style="--i:0"></i><i class="led-dot" style="--i:1"></i><i class="led-dot" style="--i:2"></i><i class="led-dot" style="--i:3"></i><i class="led-dot" style="--i:4"></i><i class="led-dot" style="--i:5"></i><i class="led-dot" style="--i:6"></i><i class="led-dot" style="--i:7"></i><i class="led-dot" style="--i:8"></i><i class="led-dot" style="--i:9"></i><i class="led-dot" style="--i:10"></i><i class="led-dot" style="--i:11"></i><i class="led-dot" style="--i:12"></i><i class="led-dot" style="--i:13"></i><i class="led-dot" style="--i:14"></i></div><div class="white-smoke-aura"></div><div class="videos-circle-box"><div class="library-title">VIDEOS</div><div class="library-sub-4k">4K</div></div></div>
<div id="historyModal" class="history-modal"><div class="history-header"><div class="history-title">DOWNLOAD HISTORY</div><button id="closeModal" class="close-btn">&times;</button></div><div id="historyList" class="history-list"></div></div>
</main>
<script>
const $=id=>document.getElementById(id), input=$("linkInput"), title=$("headerTitle"), bar=$("progressBar"), pct=$("percentageText"), videos=$("videosWrapper"), modal=$("historyModal"), list=$("historyList"), btn=$("downloadBtn"), errorBox=$("errorNotice");
const HISTORY_KEY="em_download_history", TTL=60*60*1000;let busy=false, timer=null;
function historyRead(){try{let a=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");if(!Array.isArray(a))return[];let n=Date.now(),b=a.filter(x=>{let t=Date.parse(x.date||"");return Number.isFinite(t)&&n>=t&&n-t<TTL});if(b.length!==a.length)localStorage.setItem(HISTORY_KEY,JSON.stringify(b));return b}catch{return[]}}
function historySave(url,name,method){let a=historyRead();a.unshift({url,title:name,method,date:new Date().toISOString()});localStorage.setItem(HISTORY_KEY,JSON.stringify(a.slice(0,20)));renderHistory()}
function renderHistory(){let a=historyRead();list.innerHTML="";if(!a.length){list.innerHTML='<div class="no-history">কোনো ডাউনলোড হিস্ট্রি পাওয়া যায়নি!</div>';return}a.forEach(x=>{let d=document.createElement("div");d.className="history-item";let n=document.createElement("div");n.className="history-item-name";n.textContent="📁 "+(x.title||"EM_Video");let dt=document.createElement("div");dt.className="history-item-date";dt.textContent="তারিখ: "+new Date(x.date).toLocaleString();let u=document.createElement("div");u.className="history-item-url";u.textContent="লিংক: "+x.url;let b=document.createElement("button");b.className="download-btn-item";b.textContent="💾 আবার ডাউনলোড করুন";b.onclick=()=>{input.value=x.url;modal.style.display="none";startDownload()};d.append(n,dt,u,b);list.append(d)})}
function progress(n){bar.style.width=n+"%";pct.textContent=n+"%"}function validUrl(s){try{return["http:","https:"].includes(new URL(s).protocol)}catch{return false}}
function startDownload(){if(busy)return;errorBox.textContent="";if(!validUrl(input.value.trim())){errorBox.textContent="⚠️ Please provide a valid video link.";return}downloadActual()}
window.startDownload=startDownload;
btn.addEventListener("click", startDownload);
async function downloadActual(){
  const url=input.value.trim();
  busy=true;
  btn.disabled=true;
  btn.textContent="PROCESSING…";
  errorBox.textContent="";
  title.textContent="FETCHING LINK…";
  title.style.background="linear-gradient(135deg,#00f3ff,#b062ff)";
  title.style.webkitBackgroundClip="text";
  title.style.webkitTextFillColor="transparent";
  title.style.filter="none";
  videos.classList.remove("active-smoke");
  progress(10);

  try{
    const r=await fetch("/api/prepare",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url})
    });

    let d={};
    try{d=await r.json()}catch{}
    if(!r.ok||!d.ok||!d.directUrl){
      throw new Error(d.error||`Unable to prepare the download (HTTP ${r.status})`);
    }
    if(Number.isFinite(Number(d.size)) && Number(d.size)>5*1024*1024*1024){
      throw new Error("Maximum file size is 5 GB.");
    }

    progress(70);
    historySave(url,d.title||"EM_Video",d.method||"direct");

    title.textContent="DOWNLOADING…";
    title.style.background="none";
    title.style.webkitTextFillColor="#00ff88";
    title.style.filter="drop-shadow(0 0 10px #00ff88b3)";
    videos.classList.add("active-smoke");
    btn.textContent="DOWNLOADING…";
    progress(90);

    // Start the browser download without routing large video bytes through Render.
    // Cross-origin hosts may ignore the HTML download attribute; in that case
    // the direct URL is opened as a download attempt instead of silently
    // marking the job as 100%.
    // Use the same-origin streaming endpoint as a real browser navigation.
    // This is more reliable in Android WebView than clicking a hidden anchor,
    // while Render streams the video without buffering it in RAM.
    window.location.href=d.directUrl;

    progress(100);
    title.textContent="DOWNLOAD STARTED";
    errorBox.textContent="";

    setTimeout(()=>{
      input.value="";
      busy=false;
      btn.disabled=false;
      btn.textContent="DOWNLOAD";
      progress(0);
    },3500);
  }catch(e){
    errorBox.textContent="⚠️ "+(e.message||"Unable to process the video link");
    title.textContent="EM Fast 4K";
    title.style.background="linear-gradient(135deg,#00f3ff,#b062ff)";
    title.style.webkitBackgroundClip="text";
    title.style.webkitTextFillColor="transparent";
    title.style.filter="none";
    videos.classList.remove("active-smoke");
    progress(0);
    busy=false;
    btn.disabled=false;
    btn.textContent="DOWNLOAD";
  }
}
videos.onclick=()=>{renderHistory();modal.style.display="flex"};videos.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();renderHistory();modal.style.display="flex"}};$("closeModal").onclick=()=>modal.style.display="none";input.onkeydown=e=>{if(e.key==="Enter")startDownload()};renderHistory();
</script>

<style id="rotating-stars-and-bearings">
/* Stars travel ONLY on the circular guide-line outside the center emblem. */
.star-orbit{
  position:absolute;
  inset:1.5%;
  z-index:4;
  border-radius:50%;
  pointer-events:none;
  animation:starsOrbit 11s linear infinite;
}
.orbit-star{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin:-9px;
  display:grid;
  place-items:center;
  color:#fff6cf;
  font-style:normal;
  font-size:17px;
  line-height:1;
  text-shadow:0 0 4px #fff,0 0 9px #ffd35a,0 0 18px #ff9f1a;
  animation:starSparkle 1.65s ease-in-out infinite;
}
.orbit-star::after{
  content:"";
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 7px 3px #fff1a8,0 0 14px 4px #ffb52e;
  opacity:.8;
}
/* Six stars evenly spaced on the outer guide-line. */
.s1{transform:rotate(0deg) translateY(-48%);animation-delay:0s}
.s2{transform:rotate(60deg) translateY(-48%);animation-delay:-.275s}
.s3{transform:rotate(120deg) translateY(-48%);animation-delay:-.55s}
.s4{transform:rotate(180deg) translateY(-48%);animation-delay:-.825s}
.s5{transform:rotate(240deg) translateY(-48%);animation-delay:-1.10s}
.s6{transform:rotate(300deg) translateY(-48%);animation-delay:-1.375s}
@keyframes starsOrbit{to{transform:rotate(360deg)}}
@keyframes starSparkle{
  0%,100%{opacity:.28;filter:brightness(.7) drop-shadow(0 0 2px #ffd35a);scale:.72}
  45%{opacity:1;filter:brightness(2.15) drop-shadow(0 0 8px #fff);scale:1.22}
  58%{opacity:.62;scale:.9}
}

/* Two nested mechanical rings: the larger bearing turns one way,
   the smaller cutter turns the opposite way. */
.bearing-outer,.bearing-inner{
  position:absolute;
  left:50%;top:50%;
  border-radius:50%;
  pointer-events:none;
  display:block;
}
.bearing-outer{
  width:82%;height:82%;
  transform:translate(-50%,-50%);
  z-index:3;
  animation:bearingClockwise 12s linear infinite;
  background:repeating-conic-gradient(from 0deg,#ffd77b 0deg 8deg,#4d3820 8deg 14deg,#ffe6a4 14deg 18deg,transparent 18deg 24deg);
  -webkit-mask:radial-gradient(circle,transparent 0 84%,#000 85% 100%);
  mask:radial-gradient(circle,transparent 0 84%,#000 85% 100%);
  filter:drop-shadow(0 0 4px #ffb52e88);
}
.bearing-outer::before{
  content:"";position:absolute;inset:7%;border:2px solid #ffd47799;border-radius:50%;
  box-shadow:0 0 8px #ffbd4d55,inset 0 0 8px #ffbd4d33;
}
.bearing-inner{
  width:70%;height:70%;
  transform:translate(-50%,-50%);
  z-index:4;
  animation:bearingCounter 7s linear infinite;
  background:repeating-conic-gradient(from 0deg,#d9fbff 0deg 9deg,#143b48 9deg 17deg,#8fefff 17deg 21deg,transparent 21deg 30deg);
  -webkit-mask:radial-gradient(circle,transparent 0 84%,#000 85% 100%);
  mask:radial-gradient(circle,transparent 0 84%,#000 85% 100%);
  filter:drop-shadow(0 0 5px #00eaff77);
}
.bearing-inner::before{
  content:"";position:absolute;inset:10%;border:1px solid #7ff8ff99;border-radius:50%;
  box-shadow:0 0 8px #00eaff44,inset 0 0 8px #00eaff22;
}
@keyframes bearingClockwise{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes bearingCounter{to{transform:translate(-50%,-50%) rotate(-360deg)}}

@media(max-height:740px){
